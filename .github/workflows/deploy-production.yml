---
name: Deploy to production

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  id-token: write # Required by deploy-environment for requesting the JWT
  contents: read

jobs:
  deploy:
    name: Deploy to production
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment-name: "production"
    secrets: inherit
