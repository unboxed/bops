---
name: Deploy to staging

on:
  release:
    types: [prereleased]
  workflow_dispatch:

permissions:
  id-token: write # Required by deploy-environment for requesting the JWT
  contents: read

jobs:
  deploy:
    name: Deploy to staging
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment-name: "staging"
    secrets: inherit
