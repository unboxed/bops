default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Queues are polled in the order listed, so higher priority queues first
    - queues:
        - high_priority
        - submissions
        - low_priority
      # Each worker thread needs a database connection, plus two more for
      # polling and the heartbeat, so keep this below the pool size
      threads: <%= ENV.fetch("JOB_THREADS", 3) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
